  # ──────────────────────────────────────────────────────────
  # AMBIENT MIXER — Strata
  # Web UI: http://strata.home
  # Layer ambient audio tracks with per-track volume and loop
  # controls. Download from YouTube via yt-dlp, manage a local
  # library with mood tags and segments, save mixer presets.
  # Media: /mnt/raid/strata/media → /media (in container)
  # ──────────────────────────────────────────────────────────
services:
  strata:
    build:
      context: ./strata
      dockerfile: Dockerfile
    container_name: strata
    platform: linux/arm64
    volumes:
      - /mnt/raid/strata/media:/media
    environment:
      TZ: ${TZ}
    networks:
      - proxy
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.strata.rule=Host(`strata.home`)"
      - "traefik.http.routers.strata.entrypoints=web"
      - "traefik.http.services.strata.loadbalancer.server.port=5000"
      - "traefik.http.routers.strata-secure.rule=Host(`strata.home`)"
      - "traefik.http.routers.strata-secure.entrypoints=websecure"
      - "traefik.http.routers.strata-secure.tls=true"
      - "traefik.http.routers.strata-secure.tls.certresolver=local"
      - "traefik.http.routers.strata-secure.service=strata"

networks:
  proxy:
    driver: bridge
